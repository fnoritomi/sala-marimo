dataset:
  name: beneficiarios
  label: Beneficiários da Saúde Suplementar
  remote_source: "https://pub-48d2d8006ad24ec78c704a7650702ac7.r2.dev/beneficiarios/bene_2022-rg8m.parquet"
  local_cache_path: "data/cache/bene_2022-rg8m.parquet"
  description: "Dados oficiais consolidados de beneficiários ativos, adesões e cancelamentos da ANS (exercício 2022, 81.2M linhas)."
  latest_competencia: "2022-12-01"

measures:
  beneficiarios:
    name: beneficiarios
    label: Quantidade de Beneficiários Ativos
    column: QT_ATIVOS
    type: number
    aggregation: sum
    semi_additive:
      dimension: competencia
      position: last
      window_choice: last
    description: "Medida de estoque mensal (snapshot). Não aditiva no tempo: quando a competência não estiver no agrupamento, utiliza o último snapshot do período."
    format: "#,##0"

  adesoes:
    name: adesoes
    label: Quantidade de Adesões
    column: QT_ADESOES
    type: number
    aggregation: sum
    semi_additive: null
    description: "Medida de fluxo mensal. Novas inclusões no plano no período. Totalmente aditiva no tempo."
    format: "#,##0"

  cancelamentos:
    name: cancelamentos
    label: Quantidade de Cancelamentos
    column: QT_CANCELAMENTOS
    type: number
    aggregation: sum
    semi_additive: null
    description: "Medida de fluxo mensal. Rescisões e cancelamentos de planos no período. Totalmente aditiva no tempo."
    format: "#,##0"

dimension_groups:
  - id: tempo
    label: TEMPO
    icon: calendar
  - id: beneficiario
    label: BENEFICIÁRIO
    icon: user
  - id: localizacao
    label: LOCALIZAÇÃO
    icon: map-pin
  - id: plano
    label: PLANO
    icon: shield
  - id: operadora
    label: OPERADORA
    icon: building

dimensions:
  competencia:
    name: competencia
    group: tempo
    label: Mês Competência
    column: COMPETENCIA
    type: date
    format: "YYYY-MM"
    cardinality: 12
    values:
      - "2022-01-01"
      - "2022-02-01"
      - "2022-03-01"
      - "2022-04-01"
      - "2022-05-01"
      - "2022-06-01"
      - "2022-07-01"
      - "2022-08-01"
      - "2022-09-01"
      - "2022-10-01"
      - "2022-11-01"
      - "2022-12-01"

  uf:
    name: uf
    group: localizacao
    label: UF de Residência
    column: SG_UF
    type: categorical
    cardinality: 28
    values:
      - SP
      - RJ
      - MG
      - RS
      - PR
      - BA
      - SC
      - PE
      - CE
