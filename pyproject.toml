[project]
name = "sala-marimo"
version = "0.1.0"
description = "Nova Sala de Situação da ANS com marimo, marimo-studio, DuckDB, Parquet, Svelte e Apache ECharts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.25.0",
    "marimo-studio[deno]>=0.2.3",
    "duckdb>=1.2.0",
    "pyarrow>=17.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "pytest>=8.0.0",
    "brotli>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
